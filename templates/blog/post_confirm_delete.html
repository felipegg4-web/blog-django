{% extends 'base.html' %}

{% block content %}
<h2>Remover post</h2>
<p>Tem certeza que deseja remover o post "{{ post.title }}"?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit">Sim, remover</button>
</form>

<p><a href="{% url 'post_detail' post.pk %}">Cancelar</a></p>
{% endblock %}
